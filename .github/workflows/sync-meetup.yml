name: Actualizar eventos de Meetup

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meetup-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The scraper and its tests use only Node built-ins.
      - run: npm test
      - run: npm run events:sync
      - name: Guardar la agenda actualizada
        run: |
          git add app/data/meetup-events.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: actualizar eventos de Meetup'
          git pull --rebase origin '${{ github.event.repository.default_branch }}'
          git push origin 'HEAD:${{ github.event.repository.default_branch }}'
