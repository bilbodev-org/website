name: Actualizar eventos de Meetup

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: meetup-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The scraper and its tests use only Node built-ins.
      - run: npm test
      - run: npm run events:sync
      - name: Proponer la agenda actualizada
        id: create-pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.MEETUP_SYNC_TOKEN }}
          branch: chore/actualizar-eventos-meetup
          delete-branch: true
          commit-message: 'chore: actualizar eventos de Meetup'
          title: 'chore: actualizar eventos de Meetup'
          body: 'Actualización automática de los eventos de Meetup.'
          base: ${{ github.event.repository.default_branch }}
      - name: Activar auto-merge
        if: steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.MEETUP_SYNC_TOKEN }}
          pull-request-number: ${{ steps.create-pull-request.outputs.pull-request-number }}
          merge-method: squash
